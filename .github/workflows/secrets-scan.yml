# Piece 04, layer 2: gitleaks on the pull request diff. This is the reusable form of
# pieces/04-secrets-guard/templates/workflows/secrets-scan.yml in the rollcage repo.
# To scan the whole history on a schedule, add a workflow with a `schedule:` trigger that calls this.
name: secrets-scan

on:
  workflow_call:
    secrets:
      GITLEAKS_LICENSE:
        description: Free for personal accounts. Organizations need a license.
        required: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: frankTurtle/rollcage/pieces/04-secrets-guard@73151dec00ffe3d2c35b04f81b2a8cd30e9f9d10 # v0.6.0
        with:
          license: ${{ secrets.GITLEAKS_LICENSE }}
