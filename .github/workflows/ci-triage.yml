# Piece 07: weekly CI failure triage. Read-only: it classifies failed runs and writes a report to the
# job summary and an artifact. It never opens a pull request or edits files.
name: ci-triage

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: How many days of runs to read.
        default: '14'

permissions:
  contents: read
  actions: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: frankTurtle/rollcage/pieces/07-ci-failure-triage@e311c8e81d9d95aba2cfcc9b74b2ec8b6e0f7c9d # v0.4.0
        with:
          days: ${{ inputs.days || '14' }}
