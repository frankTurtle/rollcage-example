# Piece 03: weekly delivery metrics, split at the date AI tools were rolled out.
name: dora-weekly

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  issues: read
  pull-requests: read

jobs:
  dora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: frankTurtle/rollcage/pieces/03-dora-metrics@d940be267cfef22447916dfe0fbfc684c0dc8e07 # v0.3.0
        with:
          compare-at: '2026-11-25' # SET THIS: the day your team rolled out AI tools
