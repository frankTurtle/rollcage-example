# Piece 02: fail the build if the policy file or guardrail settings are removed or weakened.
name: agent-policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frankTurtle/rollcage
          ref: develop
          path: rollcage
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --filter "@adl/agent-policy..."
        working-directory: rollcage
      - run: pnpm --filter @adl/agent-policy exec tsx src/bin.ts check --root "$GITHUB_WORKSPACE/app"
        working-directory: rollcage
