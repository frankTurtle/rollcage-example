# Install: pre-commit install --hook-type pre-commit --hook-type commit-msg
# gitleaks runs from the locally installed binary (brew install gitleaks). This is the default-rules
# form of rollcage piece 04's pre-commit template. For the audited variant, copy that template and
# build the secrets-guard CLI as its comments describe.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: conventional-commit
        name: conventional commit message
        entry: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
        language: pygrep
        args: [--negate]
        stages: [commit-msg]
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --check
        language: system
        types_or: [ts, javascript, json, yaml]
      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        types: [ts]
